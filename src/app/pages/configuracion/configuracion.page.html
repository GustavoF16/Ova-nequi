<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding configuracion-page">
  <div class="page-card">
    <h2 id="accessibility-settings-title">Opciones de accesibilidad</h2>

    <p class="intro-text">
      Ajusta la apariencia de la app para leer mejor y navegar con más comodidad.
    </p>

    <div class="setting-row" role="group" aria-labelledby="dark-mode-label">
      <div>
        <strong id="dark-mode-label">Modo oscuro</strong>
        <p>Cambia el color de toda la aplicación.</p>
      </div>

      <ion-toggle
        [(ngModel)]="modoOscuro"
        (ionChange)="cambiarModo()"
        [attr.aria-checked]="modoOscuro"
        aria-label="Activar modo oscuro">
      </ion-toggle>
    </div>

    <div class="segment-block" aria-labelledby="font-size-label">
      <div id="font-size-label" class="segment-label">
        Tamaño de texto
      </div>

      <p id="font-size-help" class="sr-only">
        Elige un tamaño cómodo para leer el contenido.
      </p>

      <ion-segment
        [(ngModel)]="tamanoTexto"
        (ionChange)="cambiarTexto()"
        aria-labelledby="font-size-label"
        aria-describedby="font-size-help"
        aria-label="Seleccionar tamaño de texto">

        <ion-segment-button value="pequeno">
          Pequeño
        </ion-segment-button>

        <ion-segment-button value="medio">
          Medio
        </ion-segment-button>

        <ion-segment-button value="grande">
          Grande
        </ion-segment-button>

      </ion-segment>
    </div>

    <div *ngIf="mensaje" class="status-note" role="status">
      {{ mensaje }}
    </div>
  </div>

  <ion-button
    expand="block"
    class="contrast-btn back-button"
    routerLink="/home"
    aria-label="Volver al menú principal">
    ⬅ Volver al menú
  </ion-button>

</ion-content>
