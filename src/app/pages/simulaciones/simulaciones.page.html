<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Simulación Nequi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="page-card">
    <section aria-labelledby="simulation-title">
      <h2 id="simulation-title">Simular envío de dinero</h2>

      <p class="intro-text">
        Prueba el flujo de envío con un número y monto para guardar tu simulación.
      </p>

      <div *ngIf="!isOnline" class="status-note" role="status">
        No hay conexión. La simulación se guarda localmente y se mantendrá en el dispositivo hasta la próxima vez que tengas red.
      </div>

      <form novalidate>
        <div class="input-box">
          <label for="numero">Número celular</label>
          <input
            id="numero"
            [(ngModel)]="numero"
            name="numero"
            placeholder="Número celular"
            inputmode="numeric"
            type="tel"
            aria-label="Número celular"
            aria-required="true"
          />
        </div>

        <div class="input-box">
          <label for="monto">Monto</label>
          <input
            id="monto"
            [(ngModel)]="monto"
            name="monto"
            type="number"
            placeholder="Monto"
            aria-label="Monto a enviar"
          />
        </div>

        <div class="button-group">
          <ion-button
            expand="block"
            class="contrast-btn"
            (click)="enviar()"
            aria-label="Enviar simulación de dinero">
            Enviar dinero
          </ion-button>
        </div>

        <div *ngIf="mensaje" class="status-note" role="status">
          {{ mensaje }}
        </div>
      </form>

      <ion-button
        expand="block"
        class="contrast-btn back-button"
        routerLink="/home"
        aria-label="Volver al menú principal">
        ⬅ Volver al menú
      </ion-button>
    </section>
  </div>
</ion-content>
