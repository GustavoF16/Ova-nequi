<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Simulación Nequi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Título -->
  <h2>Simular envío de dinero</h2>

  <!-- Campo número -->
  <ion-item>
    <ion-input
      [(ngModel)]="numero"
      placeholder="Número celular">
    </ion-input>
  </ion-item>

  <!-- Campo monto -->
  <ion-item>
    <ion-input
      [(ngModel)]="monto"
      type="number"
      placeholder="Monto">
    </ion-input>
  </ion-item>

  <br>

  <!-- Botón enviar -->
  <ion-button
    expand="full"
    color="success"
    (click)="enviar()">

    Enviar dinero

  </ion-button>

  <br>

  <!-- Mensaje -->
  <h3 *ngIf="mensaje">
    {{mensaje}}
  </h3>

  <br><br>

  <!-- BOTÓN VOLVER -->
  <ion-button
    expand="block"
    color="dark"
    routerLink="/home">

    ⬅ Volver al menú

  </ion-button>

</ion-content>
