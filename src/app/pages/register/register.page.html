<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="page-card" aria-labelledby="register-title">
    <h2 id="register-title">Registro de usuario</h2>

    <form (ngSubmit)="register()" aria-label="Formulario de registro" novalidate>
      <ion-item>
        <ion-label position="stacked">Correo electrónico</ion-label>
        <ion-input
          [(ngModel)]="email"
          name="email"
          type="email"
          placeholder="name@example.com"
          aria-label="Correo electrónico">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input
          [(ngModel)]="password"
          name="password"
          type="password"
          placeholder="Crea una contraseña"
          aria-label="Contraseña">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Modo oscuro</ion-label>
        <ion-toggle [(ngModel)]="modoOscuro" name="modoOscuro" aria-label="Activar modo oscuro"></ion-toggle>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Tamaño de texto</ion-label>
        <ion-segment [(ngModel)]="tamanoTexto" name="tamanoTexto" aria-label="Tamaño de texto">
          <ion-segment-button value="pequeno">Pequeño</ion-segment-button>
          <ion-segment-button value="medio">Medio</ion-segment-button>
          <ion-segment-button value="grande">Grande</ion-segment-button>
        </ion-segment>
      </ion-item>

      <ion-button expand="full" type="submit" class="contrast-btn" aria-label="Crear cuenta">
        Crear cuenta
      </ion-button>

      <div *ngIf="mensaje" class="status-note" role="status" aria-live="polite">{{ mensaje }}</div>
    </form>
  </section>

  <ion-button expand="block" routerLink="/login" color="medium" aria-label="Volver al inicio">⬅ Volver</ion-button>
</ion-content>
