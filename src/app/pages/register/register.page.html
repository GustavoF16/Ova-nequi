<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Crear cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="page-card" aria-labelledby="register-title">
    <h2 id="register-title">Registro de usuario</h2>

    <form (ngSubmit)="register()" aria-label="Formulario de registro" novalidate>

      <!-- Nombre -->
      <div class="form-field">
        <label for="nombre">Nombre</label>
        <input
          id="nombre"
          [(ngModel)]="nombre"
          name="nombre"
          type="text"
          placeholder="Ingresa tu nombre"
          aria-label="Nombre">
      </div>

      <!-- Apellido -->
      <div class="form-field">
        <label for="apellido">Apellido</label>
        <input
          id="apellido"
          [(ngModel)]="apellido"
          name="apellido"
          type="text"
          placeholder="Ingresa tu apellido"
          aria-label="Apellido">
      </div>

      <!-- Cédula -->
      <div class="form-field">
        <label for="cedula">Cédula</label>
        <input
          id="cedula"
          [(ngModel)]="cedula"
          name="cedula"
          type="text"
          inputmode="numeric"
          placeholder="Ingresa tu cédula"
          aria-label="Cédula">
      </div>

      <!-- Correo -->
      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          [(ngModel)]="email"
          name="email"
          type="email"
          placeholder="name@example.com"
          aria-label="Correo electrónico">
      </div>

      <!-- Contraseña -->
      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          [(ngModel)]="password"
          name="password"
          type="password"
          placeholder="Crea una contraseña"
          aria-label="Contraseña">
      </div>

      <!-- Modo oscuro -->
      <div class="form-field checkbox-field">
        <label>
          <input
            type="checkbox"
            [(ngModel)]="modoOscuro"
            name="modoOscuro">
          Modo oscuro
        </label>
      </div>

      <!-- Tamaño texto -->
      <div class="form-field">
        <label for="tamanoTexto">Tamaño de texto</label>

        <select
          id="tamanoTexto"
          [(ngModel)]="tamanoTexto"
          name="tamanoTexto">

          <option value="pequeno">Pequeño</option>
          <option value="medio">Medio</option>
          <option value="grande">Grande</option>

        </select>
      </div>

      <ion-button
        expand="full"
        type="submit"
        class="contrast-btn"
        aria-label="Crear cuenta">
        Crear cuenta
      </ion-button>

      <div
        *ngIf="mensaje"
        class="status-note"
        role="status"
        aria-live="polite">
        {{ mensaje }}
      </div>

    </form>
  </section>

  <ion-button
    expand="block"
    routerLink="/login"
    color="medium"
    aria-label="Volver al inicio">
    ⬅ Volver
  </ion-button>

</ion-content>
