<ion-content class="ion-padding">
  <section class="page-card" aria-labelledby="login-title">
    <div class="login-header">
      <h2 id="login-title">jaja estas locos</h2>
      <p>Accede a tu aprendizaje con una experiencia clara y accesible.</p>
    </div>

    <form (ngSubmit)="login()" aria-label="Formulario de inicio de sesión">

      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          [(ngModel)]="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="name@example.com"
          required />
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          [(ngModel)]="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Ingresa tu contraseña"
          required />
      </div>

      <ion-button
        expand="full"
        type="submit"
        class="button-submit"
        aria-label="Iniciar sesión">
        Iniciar sesión
      </ion-button>
    </form>

    <div *ngIf="mensaje" class="status-note" role="status">
      {{ mensaje }}
    </div>

    <div class="page-help">
      <p>
        ¿No tienes una cuenta?
        <a routerLink="/register">Crear cuenta</a>
      </p>
    </div>
  </section>
</ion-content>
