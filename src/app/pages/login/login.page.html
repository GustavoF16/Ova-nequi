```html
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>OVA NEQUI</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="page-card" aria-labelledby="login-title">
    <div class="login-header">
      <h2 id="login-title">Bienvenido</h2>
      <p>Accede a tu aprendizaje con una experiencia clara y accesible.</p>
    </div>

    <form (ngSubmit)="login()" aria-label="Formulario de inicio de sesión">
      <ion-item>
        <ion-label position="stacked">Correo electrónico</ion-label>
        <ion-input
          [(ngModel)]="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="name@example.com"
          required
          aria-required="true"
          aria-label="Correo electrónico">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input
          [(ngModel)]="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Ingresa tu contraseña"
          required
          aria-required="true"
          aria-label="Contraseña">
        </ion-input>
      </ion-item>

      <ion-button
        expand="full"
        type="submit"
        class="button-submit"
        aria-label="Iniciar sesión">
        Iniciar sesión
      </ion-button>
    </form>

    <div *ngIf="mensaje" class="status-note" role="status">
      {{ mensaje }}
    </div>

    <div class="page-help">
      <p>
        ¿No tienes una cuenta?
        <a routerLink="/register">Crear cuenta</a>
      </p>
    </div>
  </section>
</ion-content>
```
