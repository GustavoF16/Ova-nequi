services:
  ova-nequi:
    build: .
    container_name: ova-nequi-app
    ports:
      - "8080:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-helper:
    image: nginx:alpine
    container_name: ova-nequi-helper
    ports:
      - "8081:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"